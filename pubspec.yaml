name: paypact
description: Shared expense management with smart debt simplification.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

  # Google Sign-In
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # DI & value equality
  get_it: ^9.2.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.1.0

  # Networking & Utils
  dio: ^5.7.0
  uuid: ^4.4.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3

  # Sharing & invites (share sheet + QR code)
  share_plus: ^12.0.1
  qr_flutter: ^4.1.0

  # UI & platform
  fl_chart: ^1.1.1
  flutter_local_notifications: ^21.0.0
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.9
  package_info_plus: ^9.0.1
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8
  image_picker: ^1.2.3
  image: ^4.5.4 # re-encode photos small enough to live in Firestore
  crypto: ^3.0.6 # hashed e-mail lookup in the people directory
  google_mlkit_text_recognition: ^0.17.1
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  generate: true # localization (lib/l10n, l10n.yaml)
  config:
    # SPM integration breaks when the project path contains a space
    # ("Flutter Projects"); fall back to CocoaPods.
    enable-swift-package-manager: false
  uses-material-design: true
