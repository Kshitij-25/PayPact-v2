name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze, test, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Generated localizations are up to date
        run: git diff --exit-code lib/l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  functions:
    name: Cloud Functions — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  emulator:
    name: Rules and functions — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - name: Install dependencies
        run: |
          npm ci --prefix functions
          npm install --prefix rules_test
      - name: Security rules (Firestore + Storage)
        run: npm test --prefix rules_test
      - name: Functions end-to-end (Auth + Firestore + Functions emulators)
        run: npm run test:it --prefix functions
